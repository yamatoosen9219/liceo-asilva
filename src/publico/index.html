<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liceo Bicentenario Asilva - Gestión Escolar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .contenedor {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
    }
    h1 { color: #1a365d; font-size: 24px; margin-bottom: 5px; }
    .subtitulo { color: #718096; font-size: 14px; margin-top: 0; }
    
    .seccion {
      border: 1px solid #e2e8f0;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
      background-color: #fafbfc;
    }
    h2 { font-size: 18px; color: #2b6cb0; margin-top: 0; }
    
    .campo { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #4a5568; }
    input, select {
      width: 100%;
      padding: 9px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .buscador { display: flex; gap: 10px; margin-bottom: 15px; }
    
    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #2c5282; }
    
    .btn-excel { background-color: #1d6f42; width: 100%; margin-top: 5px; }
    .btn-excel:hover { background-color: #155231; }

    .btn-eliminar { background-color: #e53e3e; }
    .btn-eliminar:hover { background-color: #c53030; }
    
    .btn-editar { background-color: #dd6b20; }
    .btn-editar:hover { background-color: #c05621; }

    .btn-cerrar { background-color: #718096; }
    .btn-cerrar:hover { background-color: #4a5568; }

    .acciones-tarjeta { display: flex; gap: 10px; margin-top: 15px; }

    .tarjeta-alumno {
      border: 1px solid #cbd5e0;
      padding: 15px;
      border-radius: 8px;
      background-color: #ffffff;
      margin-top: 15px;
    }
    .oculto { display: none; }
    .destacado { font-weight: bold; color: #2b6cb0; }
    .mensaje-exito { color: #2f855a; font-weight: bold; margin-top: 10px; }
    .mensaje-error { color: #e53e3e; font-weight: bold; margin-top: 10px; font-size: 13px; }
    
    .badge-rol {
      background-color: #e2e8f0;
      color: #2d3748;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>Liceo Bicentenario Asilva 🏫</h1>
    <p class="subtitulo">Plataforma Digital de Gestión Escolar</p>

    <!-- 1. LOGIN -->
    <div id="pantallaLogin" class="seccion">
      <h2>🔐 Iniciar Sesión</h2>
      <form onsubmit="iniciarSesion(event)">
        <div class="campo">
          <label>Usuario:</label>
          <input type="text" id="loginUsuario" placeholder="Ej: admin" required>
        </div>
        <div class="campo">
          <label>Contraseña:</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" style="width: 100%;">Ingresar al Sistema</button>
      </form>
      <p id="errorLogin" class="mensaje-error oculto"></p>
    </div>

    <!-- 2. PANEL PRINCIPAL (CRUD) -->
    <div id="panelPrincipal" class="oculto">
      
      <!-- Cabecera -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background-color: #edf2f7; padding: 12px 15px; border-radius: 8px;">
        <div>
          👤 <strong id="nombreUsuarioActivo">Admin</strong>
          <span id="badgeRolActivo" class="badge-rol">admin</span>
        </div>
        <button onclick="cerrarSesion()" class="btn-cerrar" style="padding: 6px 12px; font-size: 12px;">Cerrar Sesión</button>
      </div>

      <!-- SECCIÓN A: BUSCADOR -->
      <div class="seccion">
        <h2>🔍 Buscar / Exportar Estudiantes</h2>
        <div class="buscador">
          <input type="text" id="rutInput" placeholder="Ej: 21.456.789-0">
          <button onclick="buscarAlumno()">Buscar</button>
        </div>

        <button id="btnExportarCSV" class="btn-excel" onclick="descargarCSV()">
          📊 Descargar Nómina Excel (CSV)
        </button>

        <div id="resultado" class="tarjeta-alumno oculto">
          <h3 id="nombreAlumno" style="margin-top:0;">-</h3>
          <p><strong>Curso:</strong> <span id="cursoAlumno">-</span></p>
          <p><strong>Asistencia:</strong> <span id="asistenciaAlumno">-</span></p>
          <p><strong>Promedio General:</strong> <span id="promedioAlumno" class="destacado">-</span></p>
          
          <div class="acciones-tarjeta">
            <button class="btn-editar" onclick="modoEdicion()">✏️ Editar Datos</button>
            <button id="btnEliminarAlumno" class="btn-eliminar" onclick="eliminarAlumno()">🗑️ Eliminar</button>
          </div>
        </div>

        <!-- Formulario de Edición -->
        <div id="formEdicion" class="tarjeta-alumno oculto" style="background-color: #fffaf0; border-color: #fbd38d;">
          <h3>Editar Estudiante</h3>
          <div class="campo">
            <label>Nuevo Nombre:</label>
            <input type="text" id="editNombre">
          </div>
          <div class="campo">
            <label>Nuevo Curso:</label>
            <input type="text" id="editCurso">
          </div>
          <div class="campo">
            <label>Nueva Asistencia:</label>
            <input type="text" id="editAsistencia">
          </div>
          <button class="btn-editar" onclick="guardarEdicion()">Guardar Cambios</button>
        </div>

        <p id="errorMsg" class="mensaje-error oculto"></p>
      </div>

      <!-- SECCIÓN B: REGISTRO DE ALUMNO -->
      <div class="seccion">
        <h2>➕ Registrar Nuevo Estudiante</h2>
        <form id="formRegistro" onsubmit="registrarAlumno(event)">
          <div class="campo">
            <label for="nuevoRut">RUT:</label>
            <input type="text" id="nuevoRut" placeholder="Ej: 23.888.999-1" required>
          </div>
          <div class="campo">
            <label for="nuevoNombre">Nombre Completo:</label>
            <input type="text" id="nuevoNombre" placeholder="Ej: Mateo Silva Pérez" required>
          </div>
          <div class="campo">
            <label for="nuevoCurso">Curso:</label>
            <input type="text" id="nuevoCurso" placeholder="Ej: 3° Medio C" required>
          </div>
          <div class="campo">
            <label for="nuevasNotas">Notas separadas por coma:</label>
            <input type="text" id="nuevasNotas" placeholder="Ej: 6.5, 7.0, 5.8">
          </div>
          <div class="campo">
            <label for="nuevaAsistencia">Asistencia (%):</label>
            <input type="text" id="nuevaAsistencia" placeholder="Ej: 95%">
          </div>
          <button type="submit" style="width: 100%;">Guardar Estudiante</button>
        </form>
        <p id="mensajeForm" class="oculto"></p>
      </div>

      <!-- SECCIÓN C: GESTIÓN DE USUARIOS (SOLO VISIBLE PARA ADMIN) -->
      <div id="seccionUsuarios" class="seccion oculto">
        <h2>👥 Gestión de Personal (Solo Admin)</h2>
        <form onsubmit="crearUsuario(event)">
          <div class="campo">
            <label>Nombre de Usuario:</label>
            <input type="text" id="nuevoUserNombre" placeholder="Ej: prof_gonzalez" required>
          </div>
          <div class="campo">
            <label>Contraseña:</label>
            <input type="password" id="nuevoUserPass" placeholder="••••••••" required>
          </div>
          <div class="campo">
            <label>Rol de Usuario:</label>
            <select id="nuevoUserRol">
              <option value="profesor">Profesor / Docente</option>
              <option value="admin">Administrador / UTP</option>
            </select>
          </div>
          <button type="submit" style="width: 100%; background-color: #2b6cb0;">Crear Cuenta de Usuario</button>
        </form>
        <p id="msgUserForm" class="oculto"></p>
      </div>

    </div>
  </div>

  <script>
    let rutActualGuardado = "";

    window.onload = () => {
      const token = localStorage.getItem('token_liceo');
      const usuario = localStorage.getItem('usuario_liceo');
      const rol = localStorage.getItem('rol_liceo');
      if (token) {
        mostrarPanelPrincipal(usuario, rol);
      }
    };

    async function iniciarSesion(e) {
      e.preventDefault();
      const usuarioInput = document.getElementById('loginUsuario').value;
      const passwordInput = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('errorLogin');

      try {
        const respuesta = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: usuarioInput, password: passwordInput })
        });

        const resultado = await respuesta.json();

        if (resultado.exito) {
          localStorage.setItem('token_liceo', resultado.token);
          localStorage.setItem('usuario_liceo', resultado.usuario);
          localStorage.setItem('rol_liceo', resultado.rol);
          mostrarPanelPrincipal(resultado.usuario, resultado.rol);
        } else {
          errorDiv.textContent = resultado.mensaje;
          errorDiv.classList.remove('oculto');
        }
      } catch (err) {
        errorDiv.textContent = 'Error de conexión con el servidor.';
        errorDiv.classList.remove('oculto');
      }
    }

    function mostrarPanelPrincipal(nombreUsuario, rol) {
      document.getElementById('pantallaLogin').classList.add('oculto');
      document.getElementById('panelPrincipal').classList.remove('oculto');
      document.getElementById('nombreUsuarioActivo').textContent = nombreUsuario;
      document.getElementById('badgeRolActivo').textContent = rol;

      // Si es admin, mostramos la sección de crear usuarios y borrar alumnos
      if (rol === 'admin') {
        document.getElementById('seccionUsuarios').classList.remove('oculto');
        document.getElementById('btnEliminarAlumno').classList.remove('oculto');
      } else {
        document.getElementById('seccionUsuarios').classList.add('oculto');
        document.getElementById('btnEliminarAlumno').classList.add('oculto');
      }
    }

    function cerrarSesion() {
      localStorage.clear();
      location.reload();
    }

    // CREAR USUARIO (Solo Admin)
    async function crearUsuario(e) {
      e.preventDefault();
      const token = localStorage.getItem('token_liceo');
      const msg = document.getElementById('msgUserForm');

      const datos = {
        usuario: document.getElementById('nuevoUserNombre').value,
        password: document.getElementById('nuevoUserPass').value,
        rol: document.getElementById('nuevoUserRol').value
      };

      try {
        const resp = await fetch('/api/usuarios', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(datos)
        });

        const res = await resp.json();
        msg.textContent = res.mensaje;
        msg.className = res.exito ? 'mensaje-exito' : 'mensaje-error';
        msg.classList.remove('oculto');

        if (res.exito) {
          document.getElementById('nuevoUserNombre').value = '';
          document.getElementById('nuevoUserPass').value = '';
        }
      } catch (err) {
        alert('Error al crear usuario.');
      }
    }

    async function buscarAlumno() {
      const rut = document.getElementById('rutInput').value.trim();
      const resultadoDiv = document.getElementById('resultado');
      const errorMsg = document.getElementById('errorMsg');
      document.getElementById('formEdicion').classList.add('oculto');

      if (!rut) {
        alert('Por favor ingresa un RUT válido');
        return;
      }

      try {
        const respuesta = await fetch(`/api/alumnos/rut/${rut}`);
        const datos = await respuesta.json();

        if (datos.exito) {
          rutActualGuardado = datos.alumno.rut;
          errorMsg.classList.add('oculto');
          document.getElementById('nombreAlumno').textContent = datos.alumno.nombre;
          document.getElementById('cursoAlumno').textContent = datos.alumno.curso;
          document.getElementById('asistenciaAlumno').textContent = datos.alumno.asistencia;
          document.getElementById('promedioAlumno').textContent = datos.alumno.promedioCalculado;
          resultadoDiv.classList.remove('oculto');
        } else {
          resultadoDiv.classList.add('oculto');
          errorMsg.textContent = datos.mensaje;
          errorMsg.classList.remove('oculto');
        }
      } catch (err) {
        alert('Error de conexión.');
      }
    }

    async function registrarAlumno(evento) {
      evento.preventDefault();
      const mensajeForm = document.getElementById('mensajeForm');
      const token = localStorage.getItem('token_liceo');
      
      const datosNuevoAlumno = {
        rut: document.getElementById('nuevoRut').value,
        nombre: document.getElementById('nuevoNombre').value,
        curso: document.getElementById('nuevoCurso').value,
        notas: document.getElementById('nuevasNotas').value,
        asistencia: document.getElementById('nuevaAsistencia').value
      };

      try {
        const respuesta = await fetch('/api/alumnos', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(datosNuevoAlumno)
        });

        const resultado = await respuesta.json();

        if (resultado.exito) {
          mensajeForm.className = 'mensaje-exito';
          mensajeForm.textContent = resultado.mensaje;
          mensajeForm.classList.remove('oculto');
          document.getElementById('formRegistro').reset();
        } else {
          mensajeForm.className = 'mensaje-error';
          mensajeForm.textContent = resultado.mensaje;
          mensajeForm.classList.remove('oculto');
        }
      } catch (err) {
        alert('Error al registrar estudiante.');
      }
    }

    function modoEdicion() {
      document.getElementById('editNombre').value = document.getElementById('nombreAlumno').textContent;
      document.getElementById('editCurso').value = document.getElementById('cursoAlumno').textContent;
      document.getElementById('editAsistencia').value = document.getElementById('asistenciaAlumno').textContent;
      document.getElementById('formEdicion').classList.remove('oculto');
    }

    async function guardarEdicion() {
      const token = localStorage.getItem('token_liceo');
      const datosEditados = {
        nombre: document.getElementById('editNombre').value,
        curso: document.getElementById('editCurso').value,
        asistencia: document.getElementById('editAsistencia').value
      };

      const respuesta = await fetch(`/api/alumnos/rut/${rutActualGuardado}`, {
        method: 'PUT',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(datosEditados)
      });

      const resultado = await respuesta.json();

      if (resultado.exito) {
        alert(resultado.mensaje);
        document.getElementById('formEdicion').classList.add('oculto');
        buscarAlumno();
      }
    }

    async function eliminarAlumno() {
      const token = localStorage.getItem('token_liceo');
      const confirmacion = confirm(`¿Estás seguro de eliminar al alumno con RUT ${rutActualGuardado}?`);
      if (!confirmacion) return;

      const respuesta = await fetch(`/api/alumnos/rut/${rutActualGuardado}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });

      const resultado = await respuesta.json();

      if (resultado.exito) {
        alert(resultado.mensaje);
        document.getElementById('resultado').classList.add('oculto');
        document.getElementById('rutInput').value = '';
      } else {
        alert(resultado.mensaje);
      }
    }

    async function descargarCSV() {
      try {
        const respuesta = await fetch('/api/alumnos');
        const listaAlumnos = await respuesta.json();

        if (!Array.isArray(listaAlumnos) || listaAlumnos.length === 0) {
          alert('⚠️ No hay estudiantes registrados.');
          return;
        }

        let contenidoCSV = "ID;RUT;Nombre Completo;Curso;Notas;Asistencia\n";

        listaAlumnos.forEach(alumno => {
          contenidoCSV += `${alumno.id || ''};"${alumno.rut || ''}";"${alumno.nombre || ''}";"${alumno.curso || ''}";"${alumno.notas || ''}";"${alumno.asistencia || ''}"\n`;
        });

        const blob = new Blob(["\uFEFF" + contenidoCSV], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const enlace = document.createElement('a');
        enlace.href = url;
        enlace.download = `Nomina_Alumnos_Liceo_Asilva_${new Date().toISOString().slice(0,10)}.csv`;
        
        document.body.appendChild(enlace);
        enlace.click();
        document.body.removeChild(enlace);
        URL.revokeObjectURL(url);
      } catch (error) {
        alert('❌ Error al exportar CSV.');
      }
    }
  </script>

</body>
</html>
