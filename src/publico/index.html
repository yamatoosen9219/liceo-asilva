<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liceo Bicentenario Asilva - Acceso</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
    .contenedor { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 550px; width: 100%; }
    h1 { color: #1a365d; font-size: 24px; margin-bottom: 5px; }
    .subtitulo { color: #718096; font-size: 14px; margin-top: 0; }
    .seccion { border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 25px; background-color: #fafbfc; }
    .campo { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #4a5568; }
    input { width: 100%; padding: 9px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    button { background-color: #2b6cb0; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    button:hover { background-color: #2c5282; }
    .btn-cerrar { background-color: #718096; margin-top: 10px; }
    .btn-cerrar:hover { background-color: #4a5568; }
    .oculto { display: none; }
    .mensaje-error { color: #e53e3e; font-weight: bold; margin-top: 10px; font-size: 13px; }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>Liceo Bicentenario Asilva 🏫</h1>
    <p class="subtitulo">Plataforma Digital de Gestión Escolar</p>

    <!-- 1. PANTALLA DE LOGIN -->
    <div id="pantallaLogin" class="seccion">
      <h2>🔐 Iniciar Sesión</h2>
      <form onsubmit="iniciarSesion(event)">
        <div class="campo">
          <label>Usuario:</label>
          <input type="text" id="loginUsuario" placeholder="Ej: admin" required>
        </div>
        <div class="campo">
          <label>Contraseña:</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit">Ingresar al Sistema</button>
      </form>
      <p id="errorLogin" class="mensaje-error oculto"></p>
    </div>

    <!-- 2. PANEL PRINCIPAL (CRUD) - Oculto hasta autenticarse -->
    <div id="panelPrincipal" class="oculto">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <span>Bienvenido/a, <strong id="nombreUsuarioActivo">Admin</strong></span>
        <button onclick="cerrarSesion()" class="btn-cerrar" style="width: auto; padding: 6px 12px;">Cerrar Sesión</button>
      </div>

      <div class="seccion">
        <h2>🔍 Gestionar Estudiantes</h2>
        <p>Sesión activa y protegida con JWT.</p>
        <!-- Aquí van tus módulos de búsqueda, registro y exportación a Excel -->
      </div>
    </div>
  </div>

  <script>
    // Verificar si ya existe una sesión guardada en el navegador
    window.onload = () => {
      const token = localStorage.getItem('token_liceo');
      const usuario = localStorage.getItem('usuario_liceo');
      if (token) {
        mostrarPanelPrincipal(usuario);
      }
    };

    async function iniciarSesion(e) {
      e.preventDefault();
      const usuarioInput = document.getElementById('loginUsuario').value;
      const passwordInput = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('errorLogin');

      try {
        const respuesta = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: usuarioInput, password: passwordInput })
        });

        const resultado = await respuesta.json();

        if (resultado.exito) {
          // Guardar Token en el almacenamiento local del navegador (LocalStorage)
          localStorage.setItem('token_liceo', resultado.token);
          localStorage.setItem('usuario_liceo', resultado.usuario);
          mostrarPanelPrincipal(resultado.usuario);
        } else {
          errorDiv.textContent = resultado.mensaje;
          errorDiv.classList.remove('oculto');
        }
      } catch (err) {
        errorDiv.textContent = 'Error de conexión con el servidor.';
        errorDiv.classList.remove('oculto');
      }
    }

    function mostrarPanelPrincipal(nombreUsuario) {
      document.getElementById('pantallaLogin').classList.add('oculto');
      document.getElementById('panelPrincipal').classList.remove('oculto');
      document.getElementById('nombreUsuarioActivo').textContent = nombreUsuario;
    }

    function cerrarSesion() {
      localStorage.removeItem('token_liceo');
      localStorage.removeItem('usuario_liceo');
      location.reload();
    }

    // Para realizar peticiones protegidas (ejemplo POST o DELETE):
    async function peticionProtegida(url, metodo, datos) {
      const token = localStorage.getItem('token_liceo');
      return await fetch(url, {
        method: metodo,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(datos)
      });
    }
  </script>
</body>
</html>
